<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>El Camino — Un recorrido por la vida de Jesús</title>
    <meta
      name="description"
      content="Un recorrido contemplativo en cuatro capítulos: el desierto, el sermón, el camino y el amanecer. Una invitación a caminar con Él."
    />

    <!-- Favicon de la landing: la puerta angosta. -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230a0a0a'/><path d='M16 6v20M9 13h14' stroke='%23f7f6f2' stroke-width='1.5'/></svg>"
    />

    <!-- La canónica evita que `?utm_source=...` y compañía cuenten como
         páginas distintas. Cada sección pone la suya al entrar (lib/seo.ts). -->
    <link rel="canonical" href="https://www.elcaminoangosto.site/" />
    <meta name="theme-color" content="#0a0a0a" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:site_name" content="El Camino Angosto" />
    <meta property="og:url" content="https://www.elcaminoangosto.site/" />
    <meta property="og:title" content="El Camino — Un recorrido por la vida de Jesús" />
    <meta property="og:description" content="Cuatro capítulos. Un mismo camino. Una invitación a caminar con Él." />
    <!-- Absoluta y no relativa: quien lee esto —WhatsApp, X, Facebook— no está
         en nuestro dominio y una ruta que empieza por `/` no le dice nada. -->
    <meta property="og:image" content="https://www.elcaminoangosto.site/posters/1.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="El Camino — Un recorrido por la vida de Jesús" />
    <meta name="twitter:description" content="Cuatro capítulos. Un mismo camino. Una invitación a caminar con Él." />
    <meta name="twitter:image" content="https://www.elcaminoangosto.site/posters/1.jpg" />

    <!-- Quién publica esto y qué secciones tiene, en el formato que Google
         entiende sin adivinar. De aquí salen los enlaces que a veces aparecen
         debajo del resultado principal. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://www.elcaminoangosto.site/#organizacion",
            "name": "El Camino Angosto",
            "url": "https://www.elcaminoangosto.site/",
            "description": "Plataforma cristiana con música de alabanza, devocionales diarios, oraciones guiadas, videos y comunidad."
          },
          {
            "@type": "WebSite",
            "@id": "https://www.elcaminoangosto.site/#sitio",
            "url": "https://www.elcaminoangosto.site/",
            "name": "El Camino Angosto",
            "inLanguage": "es",
            "publisher": { "@id": "https://www.elcaminoangosto.site/#organizacion" }
          }
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Space+Mono:wght@400;700&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Space+Mono:wght@400;700&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.onload=null;this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Space+Mono:wght@400;700&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
