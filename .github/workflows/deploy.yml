name: Deploy

on:
  push:
    branches: [main, develop]

# Un despliegue a la vez por entorno; no se cancela a mitad.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desplegar:
    name: Railway
    runs-on: ubuntu-latest
    # `develop` = staging · `main` = producción (HU-0.3).
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      # Las migraciones (`db/migrations/`) las aplica el propio API al arrancar
      # (`pnpm --filter @elcamino/api start` → `dist/migrar.js`), dentro de la red
      # privada de Railway y con un candado, así que no hay paso aparte aquí.

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Desplegar servicios
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          # SIEMPRE explícito: `railway environment new` cambia el entorno
          # enlazado y un `up` sin `-e` despliega al que no toca.
          RAILWAY_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
        run: |
          # Los project tokens de Railway están acotados a UN entorno. Si el de
          # este entorno aún no existe, se avisa y se sale sin romper el pipeline.
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::warning::No hay RAILWAY_TOKEN para '$RAILWAY_ENV'. Se omite el despliegue."
            echo "Créalo en Railway → Settings → Tokens y añádelo con:"
            echo "  gh secret set RAILWAY_TOKEN --env $RAILWAY_ENV --body '<token>'"
            exit 0
          fi

          npm i -g @railway/cli
          for servicio in api worker web; do
            echo "── Desplegando $servicio → $RAILWAY_ENV ──"
            railway up --service "$servicio" --environment "$RAILWAY_ENV" --ci --yes
          done

      - name: Smoke test del API
        if: github.ref == 'refs/heads/main'
        run: |
          # `/health` consulta la base de datos: un 200 aquí significa que el
          # API puede servir catálogo, no solo que el proceso arrancó. Se pide
          # además una ruta real de contenido, porque una prueba de humo que
          # nunca puede fallar no es una prueba.
          api=https://api-production-f113.up.railway.app/api
          for i in $(seq 1 20); do
            salud=$(curl -s -m 20 -o /dev/null -w '%{http_code}' "$api/health" || true)
            if [ "$salud" = "200" ]; then
              catalogo=$(curl -s -m 20 -o /dev/null -w '%{http_code}' "$api/videos" || true)
              [ "$catalogo" = "200" ] && { echo "✓ API viva y sirviendo contenido"; exit 0; }
              echo "· salud OK pero /videos devolvió $catalogo; se reintenta"
            fi
            sleep 15
          done
          echo "✗ El API no sirvió contenido tras el despliegue"; exit 1
