name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Variables ficticias: `validateEnv` corre al construir, no necesita servicios reales.
  JWT_SECRET: ci-placeholder-ci-placeholder-ci-placeholder
  S3_ENDPOINT: https://s3.ejemplo.test
  S3_BUCKET: ci
  S3_ACCESS_KEY_ID: ci-placeholder
  S3_SECRET_ACCESS_KEY: ci-placeholder
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

jobs:
  commits:
    name: Conventional Commits
    # Solo en PRs de feature (hacia develop). Los releases hacia main agrupan
    # commits ya validados (a veces un squash con asunto largo) y no se revalidan.
    if: github.event_name == 'pull_request' && github.base_ref == 'develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Sin acciones de terceros: el formato es simple y la cadena de
      # suministro de CI no merece una dependencia más.
      - name: Validar el asunto de cada commit del PR
        run: |
          TIPOS='feat|fix|refactor|docs|test|chore|perf|build|ci|style|revert'
          # El resumen arranca en minúscula (o dígito/backtick) y no acaba en punto.
          PATRON="^(${TIPOS})(\([a-z0-9,._-]+\))?!?: [a-z0-9\`áéíóúñü].{0,70}[^.]$"
          fallos=0

          while read -r sha; do
            [ -z "$sha" ] && continue
            asunto=$(git log -1 --format=%s "$sha")
            # Los merges no llevan Conventional Commit.
            [ "$(git rev-list --parents -n1 "$sha" | wc -w)" -gt 2 ] && continue

            if ! printf '%s' "$asunto" | grep -qE "$PATRON"; then
              echo "✗ ${sha:0:8}  $asunto"
              fallos=$((fallos + 1))
            fi
          done < <(git rev-list "origin/${{ github.base_ref }}..HEAD")

          if [ "$fallos" -gt 0 ]; then
            echo
            echo "$fallos commit(s) no siguen Conventional Commits."
            echo "Formato: <tipo>(<ámbito>): <resumen en imperativo>  — ver CONTRIBUTING.md"
            exit 1
          fi
          echo "✓ Todos los commits siguen Conventional Commits."

  calidad:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Turborepo cachea; el orden importa poco, pero fallar pronto ahorra minutos.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  base-de-datos:
    # El nombre se conserva porque la protección de ramas lo exige como check obligatorio.
    name: Migraciones y RLS
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # El esquema base debe aplicarse limpio sobre un Postgres vacío, y una
      # segunda pasada no debe hacer nada (idempotente).
      - name: Aplicar migraciones dos veces
        run: |
          pnpm --filter "@elcamino/api..." build
          pnpm --filter @elcamino/api db:migrate
          pnpm --filter @elcamino/api db:migrate
